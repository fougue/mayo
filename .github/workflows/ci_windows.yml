name: Windows x64

on: [push, pull_request]

jobs:
  build-windows:
    strategy:
      matrix:
        include:
        # Must fail (OCCT 7.3 is unsupported)
        - { occ_version: 7.3.0, assimp_version: 6.0.5, qt_version: '5.15', config: Debug,   pch: OFF }
        # Must succeed
        - { occ_version: 7.4.0, assimp_version: 6.0.5, qt_version: '5.15', config: Debug,   pch: OFF }
        - { occ_version: 7.5.0, assimp_version: 6.0.5, qt_version: '5.15', config: Debug,   pch: OFF }
        - { occ_version: 7.6.0, assimp_version: 6.0.5, qt_version: '5.15', config: Debug,   pch: OFF }
        - { occ_version: 7.7.0, assimp_version: 6.0.5, qt_version: '5.15', config: Debug,   pch: OFF }
        - { occ_version: 7.8.0, assimp_version: 6.0.5, qt_version: '5.15', config: Debug,   pch: ON  }
        - { occ_version: 7.9.0, assimp_version: 6.0.5, qt_version: '5.15', config: Debug,   pch: OFF }
        - { occ_version: 7.9.0, assimp_version: 6.0.5, qt_version: '5.15', config: Release, pch: OFF }
        - { occ_version: 7.9.0, assimp_version: 6.0.5, qt_version: '6.8',  config: Release, pch: ON  }
        - { occ_version: 8.0.0, assimp_version: 6.0.5, qt_version: '5.15', config: Debug,   pch: OFF }
        - { occ_version: 8.0.0, assimp_version: 6.0.5, qt_version: '6.8',  config: Release, pch: ON  }
        - { occ_version: 8.0.0, assimp_version: 6.0.5, qt_version: '6.8',  config: Release, pch: OFF }
        # Must succeed (with old Assimp versions)
        - { occ_version: 7.7.0, assimp_version: 5.3.1, qt_version: '5.15', config: Debug,   pch: ON  }
        - { occ_version: 7.8.0, assimp_version: 5.4.3, qt_version: '5.15', config: Debug,   pch: ON  }

    runs-on: windows-latest
    name: build-win-msvc-occt${{matrix.occ_version}}-assimp${{matrix.assimp_version}}-qt${{matrix.qt_version}}-${{matrix.config}}${{matrix.pch == 'ON' && '-pch' || ''}}
    continue-on-error: ${{ matrix.occ_version == '7.3.0' }}

    env:
      BIN_BASE_URL: "https://www.fougue.pro/share/bin"
      OCC_TOOLSET: vc14-64

    steps:
    - name: Set globals
      id: globals
      shell: cmd
      run: |
        for %%A in (
          "occ_7.3.0=2503e69d595bb4c4e760b629aba3d8cee5e6b8d0da43b0d790a7949c67fd15d0"
          "occ_7.4.0=6664b9a4213036ff0960edd2426258cf66844386c1a2338fa62e008f40c476bb"
          "occ_7.5.0=8000f261ecbf6689e48439aa5895304069d00a14efe28eb7f1d108450cb7a74f"
          "occ_7.6.0=137788c7693f74fb98797adfd06c1b00f66dac59beca5c3073c1f62c98b7a80f"
          "occ_7.7.0=82afb7bd5fd7097189ee4e98bf3bc02b4030cae7a82967db68d5f2b556801779"
          "occ_7.8.0=beb30920efe5e5384d500d43dcb8ba1f476a76bb65b268b1af32d807b697bdee"
          "occ_7.9.0=e3ec8adea37dd519d6580e3dd1288625c2b0dccbd811c9348c4b138ff9938d32"
          "occ_8.0.0=0e31fc307db958daa663dc67e2cdaf99fe35836640a95bb3586f93064311facf"
          "assimp_5.3.1=b6097488fa5b7a0cc610e8258e74aaa9552b48a13bc8680eedd66512d788e64f"
          "assimp_5.4.3=b321031eba023d8874ed794aa9aad5b6b132b2e4b8835ecc99ba428be48d0305"
          "assimp_6.0.5=7f4fbcbbc9d04d88a790e12bde60c4ffe1f46dd6c40cec8ce8b36f80c11e175a"
        ) do (
          for /f "tokens=1,2 delims==" %%B in (%%A) do (
            if "%%B"=="occ_%occ_version%" (
              echo occ_zip_sha256=%%C >> "%GITHUB_OUTPUT%"
            ) else if "%%B"=="assimp_%assimp_version%" (
              echo assimp_zip_sha256=%%C >> "%GITHUB_OUTPUT%"
            )
          )
        )

    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{matrix.qt_version}}.*
        host: windows
        target: desktop
        cache: true

    - name: Install OpenCascade
      uses: ./.github/actions/install-win64-zip-dependency
      with:
        cache-key: occ-${{matrix.occ_version}}-${{steps.globals.outputs.occ_zip_sha256}}
        archive: OpenCASCADE-${{matrix.occ_version}}-${{env.OCC_TOOLSET}}.zip
        url: ${{env.BIN_BASE_URL}}/OpenCASCADE-${{matrix.occ_version}}-${{env.OCC_TOOLSET}}.zip
        sha256: ${{steps.globals.outputs.occ_zip_sha256}}
        extract-dir: ${{github.workspace}}/libs

    - name: Install Assimp
      uses: ./.github/actions/install-win64-zip-dependency
      with:
        cache-key: assimp-${{matrix.assimp_version}}-${{steps.globals.outputs.assimp_zip_sha256}}
        archive: assimp-${{matrix.assimp_version}}.zip
        url: ${{env.BIN_BASE_URL}}/assimp-${{matrix.assimp_version}}.zip
        sha256: ${{steps.globals.outputs.assimp_zip_sha256}}
        extract-dir: ${{github.workspace}}/libs

    - name: Configure Compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: CMake configuration
      shell: cmd
      run: |
        mkdir ${{github.workspace}}\build
        cd ${{github.workspace}}\build

        set occ_version=${{matrix.occ_version}}
        set assimp_version=${{matrix.assimp_version}}

        cmake --version
        cmake .. ^
          -DMayo_EnablePch=${{matrix.pch}} ^
          -DMayo_BuildTests=ON ^
          -DMayo_BuildPluginAssimp=ON ^
          -DMayo_PostBuildCopyRuntimeDLLs=ON ^
          -DMayo_TestOutputFilenameTemplate="<test>-results.txt" ^
          -DOpenCASCADE_DIR=${{github.workspace}}/libs/OpenCASCADE-%occ_version%-${{env.OCC_TOOLSET}}/opencascade-%occ_version% ^
          -Dassimp_DIR=${{github.workspace}}/libs/assimp-%assimp_version%/lib/cmake/assimp-%assimp_version:~0,3%

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: cmd
      run: cmake --build . --config ${{matrix.config}} --parallel %NUMBER_OF_PROCESSORS%

    - name: Execute Unit Tests
      working-directory: ${{github.workspace}}/build
      shell: cmd
      run: ctest --test-dir . -C ${{matrix.config}} --output-on-failure

    - name: Show Unit Tests output
      if: always()
      working-directory: ${{github.workspace}}/build
      shell: cmd
      run: for %%f in (test-*-results.txt) do ( type "%%f" )
